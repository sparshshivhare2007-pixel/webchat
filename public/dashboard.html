<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 RegionalChat - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div id="dashboard">
        <!-- ========== SIDEBAR ========== -->
        <div class="sidebar glass">
            <div class="sidebar-header">
                <div class="profile-section">
                    <div class="profile-avatar" id="dashboard-avatar">
                        <img id="profile-img" src="" alt="Profile">
                        <i class="fas fa-user" id="default-avatar"></i>
                    </div>
                    <div class="profile-info">
                        <h3 id="dashboard-username">User</h3>
                        <p id="dashboard-status">🟢 Online</p>
                    </div>
                    <button class="edit-profile-btn" id="edit-profile-btn">
                        <i class="fas fa-camera"></i>
                    </button>
                    <input type="file" id="profile-upload" accept="image/*" style="display:none;">
                </div>
                <div class="sidebar-menu">
                    <button class="menu-btn active" id="rooms-tab">
                        <i class="fas fa-comments"></i> Rooms
                    </button>
                    <button class="menu-btn" id="create-tab">
                        <i class="fas fa-plus-circle"></i> Create
                    </button>
                    <button class="menu-btn" id="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <div class="sidebar-content">
                <!-- Rooms List -->
                <div id="rooms-list-container">
                    <h4><i class="fas fa-list"></i> Active Rooms</h4>
                    <div id="rooms-list">
                        <p class="loading-text">Loading rooms...</p>
                    </div>
                </div>

                <!-- Create Room Form -->
                <div id="create-room-container" style="display:none;">
                    <h4><i class="fas fa-plus-circle"></i> Create Room</h4>
                    <div class="create-form">
                        <input type="text" id="room-name" placeholder="Room Name" class="input-field">
                        <select id="room-state" class="input-field">
                            <option value="">Select State</option>
                        </select>
                        <select id="room-district" class="input-field">
                            <option value="">Select District</option>
                        </select>
                        <button id="create-room-btn" class="btn-primary">
                            <i class="fas fa-rocket"></i> Create Room
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== CHAT AREA ========== -->
        <div class="chat-area">
            <div class="chat-header glass">
                <div class="chat-room-info">
                    <h3 id="chat-room-name">Select a room</h3>
                    <p id="chat-room-meta">0 members • 0 online</p>
                </div>
                <div class="chat-actions">
                    <button id="call-btn" class="call-btn" title="Start Call">
                        <i class="fas fa-phone"></i>
                    </button>
                    <button id="end-call-btn" class="call-btn end-call" title="End Call" style="display:none;">
                        <i class="fas fa-phone-slash"></i>
                    </button>
                    <button id="theme-toggle" class="theme-btn" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>

            <!-- Call Status -->
            <div id="call-status" style="display:none;">
                <div class="call-info">
                    <i class="fas fa-phone"></i>
                    <span>Call in progress...</span>
                    <span id="call-users-count">0</span> users in call
                </div>
            </div>

            <!-- Messages -->
            <div id="messages-container">
                <div id="messages"></div>
                <div id="typing-indicator" style="display:none;">
                    <span id="typing-user"></span> is typing...
                </div>
            </div>

            <!-- Input -->
            <div class="chat-input">
                <button id="attach-btn" title="Attach File"><i class="fas fa-paperclip"></i></button>
                <button id="voice-btn" title="Voice Note"><i class="fas fa-microphone"></i></button>
                <input type="text" id="message-input" placeholder="Type a message...">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="file-input" style="display:none;" accept="image/*,.pdf,.doc,.docx,.txt,.mp3,.wav">

    <!-- Voice Recording Status -->
    <div id="voice-recording" style="display:none;">
        <div class="recording-dot"></div>
        <span class="recording-text">Recording... <span id="recording-timer">0s</span></span>
        <button class="stop-btn" id="stop-recording-btn">Stop</button>
    </div>

    <!-- Emoji Picker -->
    <div id="emoji-picker" style="display:none;">
        <div class="emoji-grid">
            <span>😊</span><span>😂</span><span>🤣</span><span>❤️</span>
            <span>😍</span><span>🤩</span><span>😎</span><span>🥳</span>
            <span>🤔</span><span>😭</span><span>🥺</span><span>😡</span>
            <span>👍</span><span>👏</span><span>🙌</span><span>💪</span>
            <span>🎉</span><span>🎊</span><span>✨</span><span>🔥</span>
            <span>👋</span><span>🤝</span><span>💯</span><span>✅</span>
        </div>
    </div>

    <script src="data/india-data.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
