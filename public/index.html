<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Regional Chat - Connect Locally</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Selection Screen -->
    <div id="selection-screen" class="screen">
        <div class="container">
            <div class="logo">
                <i class="fas fa-comments"></i>
                <h1>Regional<span>Chat</span></h1>
            </div>
            <p class="subtitle">Connect with people from your region</p>
            
            <div class="selection-box">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Enter your name" value="User_${Math.floor(Math.random()*1000)}">
                </div>

                <div class="input-group">
                    <i class="fas fa-map-marker-alt"></i>
                    <select id="state">
                        <option value="">Select State</option>
                        <option value="andhra-pradesh">Andhra Pradesh</option>
                        <option value="bihar">Bihar</option>
                        <option value="delhi">Delhi</option>
                        <option value="gujarat">Gujarat</option>
                        <option value="karnataka">Karnataka</option>
                        <option value="kerala">Kerala</option>
                        <option value="madhya-pradesh">Madhya Pradesh</option>
                        <option value="maharashtra">Maharashtra</option>
                        <option value="rajasthan">Rajasthan</option>
                        <option value="tamil-nadu">Tamil Nadu</option>
                        <option value="uttar-pradesh">Uttar Pradesh</option>
                        <option value="west-bengal">West Bengal</option>
                    </select>
                </div>

                <div class="input-group">
                    <i class="fas fa-city"></i>
                    <select id="region">
                        <option value="">Select Region</option>
                        <option value="north">North India</option>
                        <option value="south">South India</option>
                        <option value="east">East India</option>
                        <option value="west">West India</option>
                        <option value="central">Central India</option>
                        <option value="northeast">North East</option>
                    </select>
                </div>

                <div class="input-group">
                    <i class="fas fa-language"></i>
                    <select id="language">
                        <option value="">Select Language</option>
                        <option value="hindi">हिंदी (Hindi)</option>
                        <option value="english">English</option>
                        <option value="marathi">मराठी (Marathi)</option>
                        <option value="bhojpuri">भोजपुरी (Bhojpuri)</option>
                        <option value="rajasthani">राजस्थानी (Rajasthani)</option>
                        <option value="tamil">தமிழ் (Tamil)</option>
                        <option value="telugu">తెలుగు (Telugu)</option>
                        <option value="kannada">ಕನ್ನಡ (Kannada)</option>
                        <option value="malayalam">മലയാളം (Malayalam)</option>
                        <option value="gujarati">ગુજરાતી (Gujarati)</option>
                        <option value="bengali">বাংলা (Bengali)</option>
                    </select>
                </div>

                <button id="join-btn" class="btn-primary">
                    <i class="fas fa-rocket"></i> Join Chat
                </button>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen" style="display:none;">
        <div class="chat-container">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <i class="fas fa-arrow-left" id="back-btn"></i>
                    <div class="room-info">
                        <h3 id="room-name">Chat Room</h3>
                        <p id="online-count"><i class="fas fa-circle online-dot"></i> <span id="count">0</span> online</p>
                    </div>
                </div>
                <div class="header-right">
                    <button id="theme-toggle"><i class="fas fa-moon"></i></button>
                    <button id="emoji-toggle"><i class="fas fa-smile"></i></button>
                </div>
            </div>

            <!-- Messages -->
            <div id="messages-container">
                <div id="messages"></div>
                <div id="typing-indicator" style="display:none;">
                    <span id="typing-user"></span> is typing...
                </div>
            </div>

            <!-- ⭐ UPDATED INPUT with Voice & Attachment -->
            <div class="chat-input">
                <button id="attach-btn" title="Attach File"><i class="fas fa-paperclip"></i></button>
                <button id="voice-btn" title="Voice Note"><i class="fas fa-microphone"></i></button>
                <input type="text" id="message-input" placeholder="Type a message...">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- ⭐ Hidden File Input -->
    <input type="file" id="file-input" style="display:none;" accept="image/*,.pdf,.doc,.docx,.txt,.mp3,.wav,.mp4,.webm">

    <!-- ⭐ Voice Recording Status -->
    <div id="voice-recording" style="display:none; position:fixed; bottom:120px; left:50%; transform:translateX(-50%); background:white; padding:20px 30px; border-radius:15px; box-shadow:0 10px 40px rgba(0,0,0,0.2); z-index:1000;">
        <div style="display:flex; align-items:center; gap:15px;">
            <div style="width:15px; height:15px; background:red; border-radius:50%; animation:pulse 1s infinite;"></div>
            <span style="font-size:16px; font-weight:500;">Recording... <span id="recording-timer">0s</span></span>
            <button id="stop-recording-btn" style="background:#dc3545; color:white; border:none; padding:8px 20px; border-radius:10px; cursor:pointer; font-weight:500;">Stop</button>
        </div>
    </div>

    <!-- Emoji Picker (Hidden) -->
    <div id="emoji-picker" style="display:none;">
        <div class="emoji-grid">
            <span>😊</span><span>😂</span><span>🤣</span><span>❤️</span>
            <span>😍</span><span>🤩</span><span>😎</span><span>🥳</span>
            <span>🤔</span><span>😭</span><span>🥺</span><span>😡</span>
            <span>👍</span><span>👏</span><span>🙌</span><span>💪</span>
            <span>🎉</span><span>🎊</span><span>✨</span><span>🔥</span>
            <span>👋</span><span>🤝</span><span>💯</span><span>✅</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
