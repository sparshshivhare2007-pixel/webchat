<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Regional Chat - Connect Locally</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ========== SELECTION SCREEN ========== -->
    <div id="selection-screen" class="screen">
        <div class="container glass">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <h1>Regional<span>Chat</span></h1>
                <p class="subtitle">Connect with people from your region</p>
            </div>
            
            <div class="selection-box">
                <!-- ⭐ Name Input -->
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Enter your name" class="input-field" value="sparsh_shivhare">
                </div>

                <!-- ⭐ Join Button -->
                <button id="join-btn" class="btn-primary">
                    <i class="fas fa-rocket"></i> Join Chat
                </button>

                <!-- ⭐ OR Divider -->
                <div class="divider">
                    <span>or</span>
                </div>

                <!-- ⭐ Enter Room Button -->
                <button id="show-rooms-btn" class="btn-secondary">
                    <i class="fas fa-door-open"></i> Enter Room
                </button>

                <!-- ⭐ Rooms List (Hidden by default) -->
                <div id="rooms-list" style="display:none;">
                    <h4><i class="fas fa-list"></i> Active Rooms</h4>
                    <div id="rooms-container">
                        <p class="loading-text">Loading rooms...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== CHAT SCREEN ========== -->
    <div id="chat-screen" class="screen" style="display:none;">
        <div class="chat-container glass">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <i class="fas fa-arrow-left" id="back-btn"></i>
                    <div class="room-info">
                        <h3 id="room-name">Chat Room</h3>
                        <p id="online-count"><i class="fas fa-circle online-dot"></i> <span id="count">0</span> online</p>
                    </div>
                </div>
                <div class="header-right">
                    <button id="theme-toggle"><i class="fas fa-moon"></i></button>
                    <button id="emoji-toggle"><i class="fas fa-smile"></i></button>
                </div>
            </div>

            <!-- Messages -->
            <div id="messages-container">
                <div id="messages"></div>
                <div id="typing-indicator" style="display:none;">
                    <span id="typing-user"></span> is typing...
                </div>
            </div>

            <!-- Input -->
            <div class="chat-input">
                <button id="attach-btn" title="Attach File"><i class="fas fa-paperclip"></i></button>
                <button id="voice-btn" title="Voice Note"><i class="fas fa-microphone"></i></button>
                <input type="text" id="message-input" placeholder="Type a message...">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="file-input" style="display:none;" accept="image/*,.pdf,.doc,.docx,.txt,.mp3,.wav">

    <!-- Voice Recording Status -->
    <div id="voice-recording" style="display:none;">
        <div class="recording-dot"></div>
        <span class="recording-text">Recording... <span id="recording-timer">0s</span></span>
        <button class="stop-btn" id="stop-recording-btn">Stop</button>
    </div>

    <!-- Emoji Picker -->
    <div id="emoji-picker" style="display:none;">
        <div class="emoji-grid">
            <span>😊</span><span>😂</span><span>🤣</span><span>❤️</span>
            <span>😍</span><span>🤩</span><span>😎</span><span>🥳</span>
            <span>🤔</span><span>😭</span><span>🥺</span><span>😡</span>
            <span>👍</span><span>👏</span><span>🙌</span><span>💪</span>
            <span>🎉</span><span>🎊</span><span>✨</span><span>🔥</span>
            <span>👋</span><span>🤝</span><span>💯</span><span>✅</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
